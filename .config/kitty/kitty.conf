# BEGIN_KITTY_THEME
# Paul Millr
include current-theme.conf
# END_KITTY_THEME

background_opacity 0.8
background_blur 32

font_size 7.0
font_family 	 JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

#Make letters a bit closer to each other
modify_font cell_width 95%
modify_font cell_height 115%

#Make kitty borderless
#'yes' disbles round corners and title bar
#'titlebar-only' disables title bar
hide_window_decorations yes

window_padding_width 1
window_margin_width 1

#Draw only borders that separate window from neighbor
draw_minimal_border yes

placement_strategy center

#Changes multi-character ligatures
# options: always, never, cursor (don't render when cursor is over them)
disable_ligatures cursor

#Change cursor shape possible: block, beam, underline
cursor_shape block

#Color and style of URL uinder mouse
#possible styles: none, curly, straight, double, dotted, dashed
# url_color #0078bd
url_style curly

# Mappings
# Invrease font size
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+kp_add change_font_size all +1.0
map cmd+plus change_font_size all +1.0
map cmd+equal change_font_size all +1.0
map shift+cmd+equal change_font_size all +1.0

# Decrease font size
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+kp_subtract change_font_size all -1.0
map cmd+minus change_font_size all -1.0
map shift+cmd+minus change_font_size all -1.0

# Reset font size
map ctrl+shift+backspace change_font_size all 0
map cmd+0 change_font_size all 0
