set-option -sa terminal-overrides ",xterm*:Tc"

# Set tmux line position on top
set -g status-position bottom
# Auto renumbering windows
set -g renumber-windows on

# Set mouse on
set -g mouse on
# Set prefix key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Add window swicthing mappings
# bind -n M-H previous-window
# bind -n M-L next-window

# Set vi mode
set-window-option -g mode-keys vi
# Set keybindings
#Copy
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Configure the catppuccin plugin
# set -g status-left ""
# set -g @catppuccin_flavor "mocha"
# set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
# run ~/.config/tmux/plugins/tmux/catppuccin.tmux

# Dracula config
set -g @dracula-transparent-powerline-bg true
set -g @dracula-show-left-icon "#S"
set -g @dracula-git-disable-status false
set -g @dracula-show-ssh-only-when-connected true
set -g @dracula-show-fahrenheit false
set -g @dracula-show-location false

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'
# set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

# Open panes in current directory
bind H split-window -v -c "#{pane_current_path}"
bind V split-window -h -c "#{pane_current_path}"

# Custom binds for popup panes
bind-key r display-popup -w 90% -h 80% -d "#{pane_current_path}" -E "ranger"
bind-key P display-popup -w 80% -h 80% -d "#{pane_current_path}"
bind-key N display-popup -w 80% -h 80% -E 'nvim ~/Documents/Notes'
bind-key F display-popup -w 80% -h 80% -E 'nvim ~/dotfiles'

# Get back overwritten .
bind-key . command-prompt "move-window -t '%%'"

run '~/.tmux/plugins/tpm/tpm'
